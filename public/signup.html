<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Check if user is already logged in
        fetch('../php/check_auth.php')
            .then(res => res.json())
            .then(data => {
                if (data.logged_in) {
                    window.location.replace('dashboard.html');
                }
            })
            .catch(err => console.error("Auth check failed", err));
    </script>
</head>
<body class="auth-body">

    <div class="auth-card">
        <h2>Create Account</h2>

        <form action="../php/signup.php" method="POST" autocomplete="off">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Email</label>
                <!-- Added pattern to require a valid TLD (e.g., .com) -->
                <input 
                    type="email" 
                    name="email" 
                    required 
                    placeholder="user@example.com" 
                    autocomplete="off"
                    pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
                    title="Please enter a valid email address with a domain extension (e.g., .com)"
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required minlength="6" autocomplete="new-password">
            </div>

            <button type="submit">Sign Up</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

</body>
</html>
